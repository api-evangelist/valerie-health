aid: valerie-health
name: Valerie Health
description: Valerie Health is an AI-powered front office platform for independent
  healthcare provider groups, automating referral management, fax and document classification
  and data extraction, appointment scheduling, and growth analytics on top of existing
  EMR and practice management systems. Founded by Pete Shalek and Nitin Joshi and
  backed by General Catalyst and Redpoint Ventures with a $30M Series A, the company
  operates as a HIPAA Business Associate for its provider customers and publishes
  a Vanta-hosted trust center, but does not currently publish a developer portal
  or public API documentation.
